/* ---------- Espacios para imágenes (se reemplazan con fotos reales) ---------- */
const TONOS = [["var(--cian)","var(--marfil)"],["var(--naranja)","var(--marfil)"],["var(--amarillo)","var(--ink)"],["var(--morado)","var(--marfil)"],["var(--magenta)","var(--marfil)"]];
const tonoDe = a => TONOS[ARTISTAS.indexOf(a) % TONOS.length];
function piezaVacia(a, label, ratio, solido){
  const [c, i] = tonoDe(a);
  return `<span class="ph-obra${solido ? " solido" : ""}" style="--c:${c};--i:${i};--r:${ratio}" role="img" aria-label="${esc(label)}"><span class="ms" aria-hidden="true">image_inset</span></span>`;
}

function portrait(a){
  if (a.foto) return `<img src="${esc(a.foto)}" alt="Retrato de ${esc(a.nombre)}">`;
  const [c, i] = tonoDe(a);
  return `<span class="ph-icon" style="--c:${c};--i:${i}" role="img" aria-label="Espacio para la foto de ${esc(a.nombre)}"><span class="ms" aria-hidden="true">person_heart</span></span>`;
}
function workImg(o, cover){
  const a = byArtist(o.artista);
  return o.img ? `<img src="${esc(o.img)}" alt="${esc(o.titulo)}, de ${esc(a.nombre)}" loading="lazy">` : piezaVacia(a, `Espacio para la imagen de ${o.titulo}`, o.ratio[0] / o.ratio[1], cover);
}

/* ---------- Componentes ---------- */
function workCard(o, showArtist = true){
  const a = byArtist(o.artista);
  return `<button class="work" type="button" data-obra="${o.id}" aria-label="Ver ficha de ${esc(o.titulo)}">
    <div class="frame">${workImg(o)}</div>
    <div class="label">
      <span class="t">${esc(o.titulo)}</span>
      ${showArtist ? `<span class="a">${esc(a.nombre)}</span>` : ""}
      <span class="m">${esc(o.tecnica)}, ${o.anio}</span>
      ${o.venta ? `<span class="p"><span class="estado si">Disponible</span>${peso(o.precio)}</span>` : `<span class="p no"><span class="estado no">No disponible</span></span>`}
    </div>
  </button>`;
}

            <li><span class="c-item"><span class="c-ico"><span class="ms" aria-hidden="true">location_on</span></span><span><small>Dirección</small>${esc(LUGAR.direccion)}, ${esc(LUGAR.ciudad)}</span></span></li>
            <li><span class="c-item"><span class="c-ico"><span class="ms" aria-hidden="true">schedule</span></span><span><small>Horario</small>${LUGAR.horario.map(h => `${esc(h[0])}: ${esc(h[1])}`).join("<br>")}</span></span></li>
            <li><a href="tel:${LUGAR.telefono.replace(/\s/g, "")}"><span class="c-ico"><span class="ms" aria-hidden="true">call</span></span><span><small>Teléfono</small>${esc(LUGAR.telefono)}</span></a></li>
          </ul>
          <a class="btn solid lugar-btn" href="${LUGAR.mapa}" target="_blank" rel="noopener"><span class="ms" aria-hidden="true">map</span>Cómo llegar</a>
        </div>
      </div>
    </div>
  </section>

  <section class="block" id="artistas">
    <div class="wrap">
      <div class="sec-head">
        <h2>Artistas</h2>
        <p>Entra al perfil de cada artista para leer su biografía, ver todas sus obras y contactarle.</p>
      </div>
      <ul class="roster">
        ${ARTISTAS.map(a => { const n = OBRAS.filter(o => o.artista === a.slug).length;
          return `<li><a href="#/artista/${a.slug}"><span class="ph">${portrait(a)}</span><span><span class="n">${esc(a.nombre)}</span>${a.completo ? `<span class="full">${esc(a.completo)}</span>` : ""}<span class="d">${esc(a.disciplina)}</span></span><span class="c">${n} ${n === 1 ? "obra" : "obras"}</span></a></li>`; }).join("")}
      </ul>
    </div>
  </section>

  <section class="block" id="contacto">
    <div class="wrap">
      <div class="sec-head">
        <h2>Contacto</h2>
        <p>¿Quieres adquirir una obra, visitar la muestra o llevar Umbral a tu espacio? Escríbenos y te respondemos pronto.</p>
      </div>
      <div class="contact-grid">
        <div>
          <p class="c-who"><strong>${esc(CONTACTO.nombre)}</strong>${esc(CONTACTO.rol)}</p>
          <ul class="c-list">
            <li><a href="${CONTACTO.waLink || wa(CONTACTO.whatsapp, "Hola, me escribo desde la página de Umbral.")}" target="_blank" rel="noopener"><span class="c-ico">${ICON.wa}</span><span><small>WhatsApp</small>${esc(CONTACTO.telefono)}</span></a></li>
            <li><a href="mailto:${esc(CONTACTO.correo)}?subject=${encodeURIComponent("Contacto desde Umbral")}"><span class="c-ico"><span class="ms" aria-hidden="true">mail</span></span><span><small>Correo</small>${esc(CONTACTO.correo)}</span></a></li>
            <li><span class="c-item"><span class="c-ico"><span class="ms" aria-hidden="true">location_on</span></span><span><small>Lugar</small>${esc(CONTACTO.lugar)}</span></span></li>
          </ul>
        </div>
        <form class="c-form" id="c-form" novalidate>
          <h3>Escríbenos</h3>
          <div class="field"><label for="c-nombre">Tu nombre</label><input id="c-nombre" name="nombre" type="text" autocomplete="name" required></div>
          <div class="field"><label for="c-motivo">Me interesa</label>
            <select id="c-motivo" name="motivo">
              <option>Comprar una obra</option>
              <option>Visitar la muestra</option>
              <option>Contactar a un artista</option>
              <option>Llevar la muestra a mi espacio</option>
              <option>Otro</option>
            </select></div>
          <div class="field"><label for="c-mensaje">Mensaje</label><textarea id="c-mensaje" name="mensaje" rows="5" required></textarea></div>
          <p class="c-error" id="c-error" role="alert" hidden>Escribe tu nombre y tu mensaje para poder enviarlo.</p>
          <div class="c-actions">
            <button class="btn solid" type="submit" value="wa">${ICON.wa}Enviar por WhatsApp</button>
            <button class="btn" type="submit" value="mail"><span class="ms" aria-hidden="true">mail</span>Enviar por correo</button>
          </div>
          <p class="c-note">El mensaje se abre listo en WhatsApp o en tu correo; solo tienes que enviarlo.</p>
        </form>
      </div>

      <div class="c-artistas">
        <h3>Escríbele directamente a cada artista</h3>
        <ul class="c-art-list">
          ${ARTISTAS.map(a => `<li class="c-art">
            <a class="c-art-ph" href="#/artista/${a.slug}" tabindex="-1" aria-hidden="true">${portrait(a)}</a>
            <div class="c-art-txt"><a class="c-art-n" href="#/artista/${a.slug}">${esc(a.nombre)}</a><span>${esc(a.completo || a.disciplina)}</span></div>
            ${hasWa(a) ? `<a class="btn solid c-art-wa" href="${waUrl(a, `Hola, ${firstName(a.nombre)}. Te escribo desde la página de Umbral.`)}" target="_blank" rel="noopener" aria-label="Escribirle a ${esc(a.nombre)} por WhatsApp">${ICON.wa}WhatsApp</a>` : `<span class="c-art-pend">WhatsApp pronto</span>`}
          </li>`).join("")}
        </ul>
      </div>
    </div>
  </section>`;
}

function artistPage(a){
  const i = ARTISTAS.indexOf(a), prev = ARTISTAS[(i - 1 + ARTISTAS.length) % ARTISTAS.length], next = ARTISTAS[(i + 1) % ARTISTAS.length];
  const obras = OBRAS.filter(o => o.artista === a.slug);
  const venta = obras.filter(o => o.venta), expo = obras.filter(o => !o.venta);
  const msg = `Hola, ${firstName(a.nombre)}. Vi tu perfil en Umbral y me gustaría saber más sobre tu obra.`;
  return `
  <div class="wrap">
    <a class="back" href="#/" data-goto="artistas"><span class="ms" aria-hidden="true">arrow_back</span>Volver a todos los artistas</a>
    <article class="artist">
      <div class="portrait">${portrait(a)}</div>
      <div>
        <p class="disc">${esc(a.disciplina)}</p>
        <h1>${esc(a.nombre)}</h1>${a.completo ? `<p class="full-name">${esc(a.completo)}</p>` : ""}
        <div class="bio"><p>${esc(a.bio[0])}</p>${a.bio.length > 1 ? `<div class="bio-rest" id="bio-rest" hidden>${a.bio.slice(1).map(p => `<p>${esc(p)}</p>`).join("")}</div><button class="more" type="button" aria-expanded="false" aria-controls="bio-rest">Leer biografía completa</button>` : ""}</div>
        <div class="contact">
          ${hasWa(a) ? `<a class="btn solid" href="${waUrl(a, msg)}" target="_blank" rel="noopener">${ICON.wa}Escribir por WhatsApp</a>` : ""}
          ${a.instagram ? `<a class="btn red" href="${esc(a.instagram)}" target="_blank" rel="noopener" aria-label="Instagram de ${esc(a.nombre)}" title="Instagram">${ICON.ig}</a>` : ""}
          ${a.tiktok ? `<a class="btn red" href="${esc(a.tiktok)}" target="_blank" rel="noopener" aria-label="TikTok de ${esc(a.nombre)}" title="TikTok">${ICON.tt}</a>` : ""}
          ${a.web ? `<a class="btn red" href="${esc(a.web)}" target="_blank" rel="noopener" aria-label="Portafolio de ${esc(a.nombre)}" title="Portafolio"><span class="ms" aria-hidden="true">language</span></a>` : ""}
          ${a.facebook ? `<a class="btn red" href="${esc(a.facebook)}" target="_blank" rel="noopener" aria-label="Facebook de ${esc(a.nombre)}" title="Facebook">${ICON.fb}</a>` : ""}
        </div>
      </div>
    </article>
  </div>
  ${venta.length ? `<section class="block"><div class="wrap"><div class="sec-head"><h2>Obras en venta</h2><p>${venta.length} ${venta.length === 1 ? "obra disponible" : "obras disponibles"}.</p></div><div class="wall">${venta.map(o => workCard(o, false)).join("")}</div></div></section>` : ""}
  ${expo.length ? `<section class="block"><div class="wrap"><div class="sec-head"><h2>Obras en exhibición</h2></div><div class="wall">${expo.map(o => workCard(o, false)).join("")}</div></div></section>` : ""}
  <div class="wrap">
    <nav class="pager" aria-label="Otros artistas">
      <a href="#/artista/${prev.slug}"><small><span class="ms" aria-hidden="true">west</span>Artista anterior</small><span>${esc(prev.nombre)}</span></a>
      <a href="#/artista/${next.slug}"><small>Siguiente artista<span class="ms" aria-hidden="true">east</span></small><span>${esc(next.nombre)}</span></a>
    </nav>
  </div>
  ${hasWa(a) ? `<div class="wa-bar"><a class="btn solid" href="${waUrl(a, msg)}" target="_blank" rel="noopener">${ICON.wa}Escribirle a ${esc(firstName(a.nombre))}</a></div>` : ""}`;
}

/* ---------- Carrusel: cambia de obra cada 5 segundos ---------- */
const PAUSE = '<span class="ms" aria-hidden="true">pause</span>';
const PLAY = '<span class="ms" aria-hidden="true">play_arrow</span>';
function featureHTML(list){
  if (!list.length) return "";
  return `<div class="feature" id="feature" role="region" aria-roledescription="carrusel" aria-label="Obras en venta destacadas">
    <div class="slides">${list.map((o,k) => { const a = byArtist(o.artista);
      const msg = `Hola, ${firstName(a.nombre)}. Vi tu obra “${o.titulo}” en Umbral y me gustaría recibir más información.`;
      return `<div class="slide" role="group" aria-roledescription="diapositiva" aria-label="${k+1} de ${list.length}">
        <button class="bg" type="button" data-obra="${o.id}" aria-label="Ver ficha de ${esc(o.titulo)}">${workImg(o, true)}</button>
        <div class="shade" aria-hidden="true"></div>
        <div class="cap">
          <h3>${esc(o.titulo)}</h3>
          <p class="meta"><a href="#/artista/${a.slug}">${esc(a.nombre)}</a>, ${esc(o.tecnica)}</p>
          <div class="row"><span class="estado si">Disponible</span><span class="price">${peso(o.precio)}</span></div>
          <div class="actions">
            ${hasWa(a) ? `<a class="btn solid" href="${waUrl(a, msg)}" target="_blank" rel="noopener">${ICON.wa}Consultar por WhatsApp</a>` : ""}
            <button class="btn" type="button" data-obra="${o.id}">Ver ficha</button>
          </div>
        </div>
      </div>`; }).join("")}</div>
    <p class="eyebrow" aria-hidden="true">Destacadas</p>
    <button class="nav prev" type="button" data-act="prev" aria-label="Obra anterior"><span class="ms" aria-hidden="true">chevron_left</span></button>
    <button class="nav next" type="button" data-act="next" aria-label="Obra siguiente"><span class="ms" aria-hidden="true">chevron_right</span></button>
    <div class="feature-bar">
      <div class="dots">${list.map((o,k) => `<button class="dot" type="button" aria-label="Ir a la obra ${k+1}"><i></i></button>`).join("")}</div>
      <button class="pausa" type="button" data-act="pause" aria-label="Pausar presentación">${PAUSE}</button>
    </div>
  </div>`;
}
function initFeature(){
  const f = $("#feature"); if (!f) return;
  const slides = [...f.querySelectorAll(".slide")], dots = [...f.querySelectorAll(".dot")];
  let i = 0;
  const go = n => {
    i = (n + slides.length) % slides.length;
    slides.forEach((s,k) => { s.classList.toggle("on", k === i); s.inert = k !== i; s.setAttribute("aria-hidden", k !== i); });
    dots.forEach((d,k) => { d.classList.toggle("on", k === i); d.classList.toggle("past", k < i);
      const bar = d.firstElementChild; bar.style.animation = "none"; void bar.offsetWidth; bar.style.animation = ""; });
  };
  dots.forEach((d,k) => {
    d.addEventListener("click", () => go(k));
    d.firstElementChild.addEventListener("animationend", () => { if (k === i) go(i + 1); });
  });
  f.querySelector('[data-act="prev"]').addEventListener("click", () => go(i - 1));
  f.querySelector('[data-act="next"]').addEventListener("click", () => go(i + 1));
  const pb = f.querySelector('[data-act="pause"]');
  pb.addEventListener("click", () => { const p = f.classList.toggle("paused");
    pb.innerHTML = p ? PLAY : PAUSE; pb.setAttribute("aria-label", p ? "Reanudar presentación" : "Pausar presentación"); });
  f.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") f.classList.add("hold"); });
  f.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") f.classList.remove("hold"); });
  f.addEventListener("focusin", e => { if (e.target.matches(":focus-visible")) f.classList.add("hold"); });
  /* Deslizar con el dedo para cambiar de obra */
  const sl = f.querySelector(".slides"); let x0 = null, y0 = 0;
  sl.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive:true });
  sl.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) go(dx < 0 ? i + 1 : i - 1);
  }, { passive:true });
  f.addEventListener("focusout", e => { if (!f.contains(e.relatedTarget)) f.classList.remove("hold"); });
  go(0);
}
document.addEventListener("visibilitychange", () => $("#feature")?.classList.toggle("hold-tab", document.hidden));

/* ---------- Ficha de obra ---------- */
const dlg = $("#ficha");
let vList = [], vIdx = 0;
function openWork(id, list){
  vList = list && list.length ? list : [id];
  vIdx = Math.max(0, vList.indexOf(id));
  drawViewer();
  if (!dlg.open){ dlg.showModal(); $("#feature")?.classList.add("hold-dlg"); }
}
function drawViewer(dir){
  const o = OBRAS.find(x => x.id === vList[vIdx]); if (!o) return;
  const a = byArtist(o.artista), many = vList.length > 1;
  const msg = `Hola, ${firstName(a.nombre)}. Vi tu obra “${o.titulo}” en Umbral y me gustaría recibir más información.`;
  dlg.innerHTML = `
  <div class="viewer">
    <div class="v-top">
      <p class="eyebrow">${o.venta ? "Obra en venta" : "Obra en exhibición"}</p>
      ${many ? `<span class="v-count">${vIdx + 1} de ${vList.length}</span>` : ""}
    </div>
    <div class="v-art" style="--r:${o.ratio[0] / o.ratio[1]}">${workImg(o)}</div>
    <div class="v-info">
      <h3 id="ficha-t">${esc(o.titulo)}</h3>
      <p class="v-by"><a href="#/artista/${a.slug}" data-close>${esc(a.nombre)}</a></p>
      <p class="v-meta">${esc(o.tecnica)}, ${esc(o.medidas)}, ${o.anio}</p>
      <div class="v-row">${o.venta ? `<span class="estado si">Disponible</span><span class="v-price">${peso(o.precio)}</span>` : `<span class="estado no">No disponible</span>`}</div>
      ${o.desc ? `<p class="v-desc">${esc(o.desc)}</p>` : ""}
      <div class="actions">
        ${hasWa(a) ? `<a class="btn solid" href="${waUrl(a, msg)}" target="_blank" rel="noopener">${ICON.wa}${o.venta ? "Consultar por WhatsApp" : "Escribirle al artista"}</a>` : ""}
        <a class="btn" href="#/artista/${a.slug}" data-close>Ver perfil del artista<span class="ms" aria-hidden="true">arrow_forward</span></a>
      </div>
    </div>
    ${many ? `<button class="v-nav prev" type="button" data-v="-1" aria-label="Obra anterior"><span class="ms" aria-hidden="true">chevron_left</span></button>
    <button class="v-nav next" type="button" data-v="1" aria-label="Obra siguiente"><span class="ms" aria-hidden="true">chevron_right</span></button>` : ""}
    <button class="close" type="button" aria-label="Cerrar" data-close><span class="ms" aria-hidden="true">close</span></button>
  </div>`;
  dlg.scrollTop = 0;
  if (dir) dlg.querySelector(`[data-v="${dir}"]`)?.focus();
}
function stepViewer(d){ if (vList.length < 2) return; vIdx = (vIdx + d + vList.length) % vList.length; drawViewer(d); }
dlg.addEventListener("keydown", e => { if (e.key === "ArrowRight") stepViewer(1); if (e.key === "ArrowLeft") stepViewer(-1); });
let vx = null, vy = 0;
dlg.addEventListener("touchstart", e => { if (!e.target.closest(".v-art")) return; vx = e.touches[0].clientX; vy = e.touches[0].clientY; }, { passive:true });
dlg.addEventListener("touchend", e => {
  if (vx === null) return;
  const dx = e.changedTouches[0].clientX - vx, dy = e.changedTouches[0].clientY - vy; vx = null;
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.3) stepViewer(dx < 0 ? 1 : -1);
}, { passive:true });
dlg.addEventListener("close", () => $("#feature")?.classList.remove("hold-dlg"));
dlg.addEventListener("click", e => {
  const nv = e.target.closest("[data-v]"); if (nv){ stepViewer(+nv.dataset.v); return; }
  if (e.target.closest("[data-close]")) dlg.close();
});

/* ---------- Navegación ---------- */
let pending = null;
function render(){
  const m = location.hash.match(/^#\/artista\/([\w-]+)/);
  const a = m && byArtist(m[1]);
  $("#app").innerHTML = a ? artistPage(a) : home();
  initFeature();
  document.body.classList.toggle("has-bar", hasWa(a));
  document.title = a ? `${a.nombre} | Umbral` : "Umbral | Colectivo de artistas tameños";
  if (pending && !a){ const t = document.getElementById(pending); pending = null; requestAnimationFrame(() => t && t.scrollIntoView()); }
  else window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const go = e.target.closest("[data-goto]");
  if (go){
    e.preventDefault();
    const target = go.dataset.goto;
    if (location.hash.startsWith("#/artista/")){ pending = target; location.hash = "#/"; }
    else document.getElementById(target)?.scrollIntoView();
    return;
  }
  const w = e.target.closest("[data-obra]");
  if (w){ const box = w.closest(".wall, #feature"); const ids = box ? [...new Set([...box.querySelectorAll("[data-obra]")].map(x => x.dataset.obra))] : [w.dataset.obra]; openWork(w.dataset.obra, ids); }
});
/* Biografía: mostrar el texto completo o solo el primer párrafo */
document.addEventListener("click", e => {
  const b = e.target.closest(".more"); if (!b) return;
  const rest = document.getElementById(b.getAttribute("aria-controls"));
  const open = rest.hidden;
  rest.hidden = !open;
  b.setAttribute("aria-expanded", open);
  b.textContent = open ? "Mostrar menos" : "Leer biografía completa";
  if (!open) b.closest(".bio").scrollIntoView({ block:"nearest" });
});
/* Formulario de contacto: arma el mensaje y lo abre en WhatsApp o en el correo */
document.addEventListener("submit", e => {
  const f = e.target.closest("#c-form"); if (!f) return;
  e.preventDefault();
  const nombre = f.nombre.value.trim(), motivo = f.motivo.value, mensaje = f.mensaje.value.trim();
  const err = document.getElementById("c-error");
  if (!nombre || !mensaje){ err.hidden = false; (nombre ? f.mensaje : f.nombre).focus(); return; }
  err.hidden = true;
  const texto = `Hola, soy ${nombre}. Te escribo desde la página de Umbral.\nMotivo: ${motivo}\n\n${mensaje}`;
  const via = e.submitter ? e.submitter.value : "wa";
  if (via === "mail") location.href = `mailto:${CONTACTO.correo}?subject=${encodeURIComponent("Umbral: " + motivo)}&body=${encodeURIComponent(texto)}`;
  else window.open(wa(CONTACTO.whatsapp, texto), "_blank", "noopener");
});
window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
